<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRYNTIX — Entrar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0A1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-texto {
      font-size: 28px;
      font-weight: 600;
      color: #0A1628;
      letter-spacing: -0.5px;
    }
    .logo-texto span { color: #3B82F6; }
    .logo-sub {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 4px;
    }
    .form-grupo { margin-bottom: 16px; }
    .form-grupo label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94A3B8;
      margin-bottom: 6px;
    }
    .input-wrap {
      display: flex;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-wrap:focus-within {
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .input-wrap input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      outline: none;
      font-size: 14px;
      color: #0A1628;
      background: transparent;
    }
    .input-sufixo {
      padding: 10px 12px;
      background: #F8FAFC;
      color: #94A3B8;
      font-size: 11px;
      border-left: 1px solid #CBD5E1;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }
    .btn-entrar {
      width: 100%;
      padding: 12px;
      background: #3B82F6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-entrar:hover { background: #1D4ED8; }
    .btn-entrar:disabled { opacity: 0.6; cursor: not-allowed; }
    .erro {
      background: #FEE2E2;
      color: #991B1B;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }
    .erro.visivel { display: block; }
    .versao {
      text-align: center;
      font-size: 11px;
      color: #CBD5E1;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-texto">PRYN<span>TIX</span></div>
      <div class="logo-sub">Sistema de gestão para gráficas</div>
    </div>

    <div class="form-grupo">
      <label>Usuário</label>
      <div class="input-wrap">
        <input type="text" id="usuario" placeholder="seu nome" autocomplete="username" />
        <span class="input-sufixo">@pryntix.interno</span>
      </div>
    </div>

    <div class="form-grupo">
      <label>Senha</label>
      <div class="input-wrap">
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
      </div>
    </div>

    <button class="btn-entrar" id="btn-entrar" onclick="entrar()">Entrar</button>
    <div class="erro" id="erro-msg"></div>
    <div class="versao">PRYNTIX v1.0 · Printer & Co.</div>
  </div>

  <script>
    const SUPA_URL  = 'https://hrddxxudxfiffesumneu.supabase.co';
    const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZGR4eHVkeGZpZmZlc3VtbmV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODE3MjQsImV4cCI6MjEwMTM1NzcyNH0.qtHywxLaGNRngqY5oGtsyK8LsA5h4mtq9w2-PzsIaxg';
    const DOMINIO   = '@pryntix.interno';
    const SESSAO_KEY = 'pryntix_sessao';
    const SESSAO_DUR = 60 * 60 * 1000;

    // Redireciona se já logado
    const raw = localStorage.getItem(SESSAO_KEY);
    if (raw) {
      try {
        const s = JSON.parse(raw);
        if (Date.now() < s.expira) window.location.href = 'dashboard.html';
      } catch { localStorage.removeItem(SESSAO_KEY); }
    }

    document.getElementById('usuario').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('senha').focus();
    });
    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') entrar();
    });

    async function entrar() {
      const usuario = document.getElementById('usuario').value.trim();
      const senha   = document.getElementById('senha').value;
      const btn     = document.getElementById('btn-entrar');
      const erro    = document.getElementById('erro-msg');

      erro.classList.remove('visivel');
      if (!usuario || !senha) {
        erro.textContent = 'Preencha usuário e senha.';
        erro.classList.add('visivel');
        return;
      }

      const email = usuario.includes('@') ? usuario : usuario + DOMINIO;
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPA_ANON },
          body: JSON.stringify({ email, password: senha })
        });
        const dados = await res.json();
        if (!res.ok || !dados.access_token) throw new Error('Usuário ou senha inválidos.');

        const sessao = {
          token:   dados.access_token,
          refresh: dados.refresh_token,
          usuario: dados.user.email,
          nome:    dados.user.user_metadata?.nome || usuario,
          perfil:  dados.user.user_metadata?.perfil || 'usuario',
          expira:  Date.now() + SESSAO_DUR
        };
        localStorage.setItem(SESSAO_KEY, JSON.stringify(sessao));
        window.location.href = 'dashboard.html';
      } catch (e) {
        erro.textContent = e.message || 'Erro ao conectar. Tente novamente.';
        erro.classList.add('visivel');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
